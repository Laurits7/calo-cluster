config_version: 2
outputs_dir: /home/laurits/20251128_MLPF_clustering
predictions_dir: ${outputs_dir}/predictions
plots_dir: ${outputs_dir}/plots
data_dir: ${outputs_dir}/data
hydra:
  run:
    dir: ${outputs_dir}/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
seed: 1588147245
deterministic: False
resume_ckpt: null
init_ckpt: null
overfit: False
log_level: INFO
val_check_interval: 0.5
task: instance
defaults:
  - train: single_gpu
  - dataset: cldhits
  - optimizer: adam
  # - semantic_criterion: cross_entropy_loss  # Kui see enabled, siis on task "panoptic"
  - embed_criterion: centroid_all  # eelnevalt offset
  - scheduler: one_cycle_lr
  - model: spvcnn
  # - wandb: upload
  - checkpoint: all
  - swa: inactive
  - cluster: local